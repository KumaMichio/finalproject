# Camera config v3 — 6 cameras mounted on traffic light poles, 3 intersections in Town10HD_Opt
#
# Traffic light positions queried from CARLA (2026-06-18):
#   Intersection A (-119.2, 12.0): TL_N=(-119.2, 5.1)   TL_S=(-119.2, 19.0)
#   Intersection B ( -63.3, 13.6): TL_N=( -64.3, 7.1)   TL_S=( -62.4, 20.2)
#   Intersection C ( -31.8, 26.9): TL_N=( -31.9, 20.3)  TL_S=( -31.6, 33.6)
#
# Mount design:
#   XY = exact traffic light pole base position (from CARLA actor query)
#   Z  = 9m  (above overpass deck ~z=7 and tree canopy ~z=8 in Town10HD_Opt)
#            NOTE: TL poles are only ~6m tall, but the overpass structure and trees
#            at the intersection block the view at z=6.  z=9 is the minimum height
#            to clear both obstructions while keeping cameras at TL XY positions.
#   Pitch = -30°  (steeper than -25° for better downward view at z=9 over intersection)
#   FOV   = 105°  (covers full intersection width ≈ 18m at 7m horizontal distance)
#
# Yaw strategy — N TL looks South, S TL looks North:
#   North TL (y < center_y): yaw=90  (due South, +Y direction in CARLA)
#   South TL (y > center_y): yaw=270 (due North, -Y direction in CARLA)
#   With 105° horizontal FOV, both E-W and N-S approach lanes are covered.
#
# Changes from v2:
#   - Cameras moved from diagonal corners (10m off-road) to actual TL pole XY
#   - CAM_002 fix: (-109.2, 22.0) → (-119.2, 19.0) [was facing arch building]
#   - CAM_005 fix: (-41.8, 16.9) → (-31.9, 20.3) [was blocked by NW corner trees]
#   - Pitch changed from -25° to -30° (steeper for better intersection coverage)
#   - Z kept at 9 (same as v2) — needed to clear overpass deck and tree canopy

cameras:
  camera_0:
    camera_id: "CAM_001"
    position: [-119.2, 5.1, 9]      # North TL pole, intersection A
    rotation: [-30, 90, 0]           # pitch=-30°  yaw=90° (looking due South into intersection)
    view_angle: 105
    resolution: [960, 540]
    fps: 10

  camera_1:
    camera_id: "CAM_002"
    position: [-119.2, 19.0, 9]     # South TL pole, intersection A  [FIX: was at arch building]
    rotation: [-30, 270, 0]          # yaw=270° (looking due North into intersection)
    view_angle: 105
    resolution: [960, 540]
    fps: 10

  camera_2:
    camera_id: "CAM_003"
    position: [-64.3, 7.1, 9]       # North TL pole, intersection B
    rotation: [-30, 90, 0]
    view_angle: 105
    resolution: [960, 540]
    fps: 10

  camera_3:
    camera_id: "CAM_004"
    position: [-62.4, 20.2, 9]      # South TL pole, intersection B
    rotation: [-30, 270, 0]
    view_angle: 105
    resolution: [960, 540]
    fps: 10

  camera_4:
    camera_id: "CAM_005"
    position: [-20.0, 26.9, 9]      # East approach of intersection C — North TL at (-31.9, 20.3)
                                     # is completely blocked by a large banyan tree even at z=9.
                                     # East road at (-20, 26.9) is tree-free; yaw=200 looks WNW
                                     # to cover both E-W approach and intersection C north arm.
    rotation: [-30, 200, 0]          # yaw=200° = WNW (slightly north of due west)
    view_angle: 105
    resolution: [960, 540]
    fps: 10

  camera_5:
    camera_id: "CAM_006"
    position: [-31.6, 33.6, 9]      # South TL pole, intersection C
    rotation: [-30, 270, 0]
    view_angle: 105
    resolution: [960, 540]
    fps: 10

# Regions of Interest — to be calibrated after verifying new camera positions
rois:
  CAM_001:
    zones:
      - name: "intersection_A_north"
        polygon: []
        alert_types: ["entry", "red_light"]
  CAM_002:
    zones:
      - name: "intersection_A_south"
        polygon: []
        alert_types: ["entry", "red_light"]
  CAM_003:
    zones:
      - name: "intersection_B_north"
        polygon: []
        alert_types: ["entry", "red_light"]
  CAM_004:
    zones:
      - name: "intersection_B_south"
        polygon: []
        alert_types: ["entry", "red_light"]
  CAM_005:
    zones:
      - name: "intersection_C_north"
        polygon: []
        alert_types: ["entry", "red_light"]
  CAM_006:
    zones:
      - name: "intersection_C_south"
        polygon: []
        alert_types: ["entry", "red_light"]

# Spatio-Temporal Filter
camera_topology:
  CAM_001__CAM_002: [0.5, 10]
  CAM_002__CAM_001: [0.5, 10]
  CAM_003__CAM_004: [0.5, 10]
  CAM_004__CAM_003: [0.5, 10]
  CAM_005__CAM_006: [0.5, 10]
  CAM_006__CAM_005: [0.5, 10]
  CAM_001__CAM_003: [3, 60]
  CAM_001__CAM_004: [3, 60]
  CAM_002__CAM_003: [3, 60]
  CAM_002__CAM_004: [3, 60]
  CAM_003__CAM_001: [3, 60]
  CAM_004__CAM_001: [3, 60]
  CAM_003__CAM_002: [3, 60]
  CAM_004__CAM_002: [3, 60]
  CAM_003__CAM_005: [2, 60]
  CAM_003__CAM_006: [2, 60]
  CAM_004__CAM_005: [2, 60]
  CAM_004__CAM_006: [2, 60]
  CAM_005__CAM_003: [2, 60]
  CAM_006__CAM_003: [2, 60]
  CAM_005__CAM_004: [2, 60]
  CAM_006__CAM_004: [2, 60]
  CAM_001__CAM_005: [5, 120]
  CAM_001__CAM_006: [5, 120]
  CAM_002__CAM_005: [5, 120]
  CAM_002__CAM_006: [5, 120]
  CAM_005__CAM_001: [5, 120]
  CAM_006__CAM_001: [5, 120]
  CAM_005__CAM_002: [5, 120]
  CAM_006__CAM_002: [5, 120]

incident_detection:
  wrong_way:
    lanes:
      CAM_001:
        direction: [0.0, 1.0]   # South (+Y) = normal flow on N-S road
      CAM_002:
        direction: [0.0, -1.0]  # North (-Y) = normal flow on N-S road
      CAM_003:
        direction: [0.0, 1.0]
      CAM_004:
        direction: [0.0, -1.0]
      CAM_005:
        direction: [0.0, 1.0]
      CAM_006:
        direction: [0.0, -1.0]
    min_speed: 15
    angle_threshold_deg: 100
    min_frames: 10
    window: 8
  red_light:
    min_speed: 10
    search_radius_m: 40
  disabled_types:
    - SUDDEN_ACCEL
    - CAMERA_TRANSITION
    - STOPPED_VEHICLE
    - VEHICLE_PROXIMITY

system:
  synchronous_mode: true
  fixed_delta_seconds: 0.1
  max_age: 30
  min_hits: 3
  reid_threshold: 0.5
  trajectory_window: 10
  prediction_steps: 5
